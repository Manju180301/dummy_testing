{% if error %}
<div
    style="
    background:red;
    color:white;
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
">
    {{ error }}
</div>
{% endif %}

<form method="POST" action="{% url 'face_record' %}">
    {% csrf_token %}

    <input
    type="text"
    name="emp_id"
    placeholder="Enter Employee ID"
    required
    >

    <br><br>

    <input
        type="text"
        name="employee_name"
        placeholder="Enter Employee Name"
        required
    >

    <br><br>

    <input
        type="text"
        name="department"
        placeholder="Enter Department"
        required
    >

    <button type="submit">
        Start Recording
    </button>
</form>
