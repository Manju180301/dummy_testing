<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 6px; text-align: center; }
        img { width: 80px; }
        h2 { text-align: center; }
    </style>
</head>
<body>

<h2>Group Detection Report</h2>

<table>
    <thead>
        <tr>
            <th>Image</th>
            <th>Place</th>
            <th>Date &amp; Time</th>
            <th>Detected Count</th>
        </tr>
    </thead>
    <tbody>
        {% for r in records %}
        <tr>
            <td>
                {% if r.image_path %}
                    <img src="/media/{{ r.image_path }}">
                {% endif %}
            </td>
            <td>{{ r.place }}</td>
            <td>{{ r.created_at|date:"Y-m-d H:i" }}</td>
            <td>{{ r.detected_count }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
