<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boundary Editor - {{ camera_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            padding: 20px;
        }
        .boundary-editor-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .canvas-area { flex: 3; background: #1a1a2e; border-radius: 12px; padding: 15px; }
        canvas { width: 100%; background: #000; border-radius: 8px; cursor: crosshair; }
        .controls-area { flex: 1; background: #f8f9fa; border-radius: 12px; padding: 20px; min-width: 280px; }
        .instruction { background: #e9ecef; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; }
        .btn-save { background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .btn-save:hover { background: #218838; }
        .btn-update { background: #007bff; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .btn-update:hover { background: #0056b3; }
        .btn-clear { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .btn-clear:hover { background: #5a6268; }
        .btn-refresh { background: #17a2b8; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; font-size: 14px; }
        .btn-refresh:hover { background: #138496; }
        .poly-list { max-height: 400px; overflow-y: auto; background: white; border-radius: 8px; padding: 10px; margin-top: 10px; }
        .poly-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; position: relative; padding-right: 80px; }
        .poly-item:hover { background: #f0f0f0; }
        .poly-item.active { background: #ffe0e0; border-left: 3px solid #dc3545; }
        .poly-name { font-weight: bold; margin-bottom: 5px; }
        .poly-points { font-size: 11px; color: #666; font-family: monospace; }
        .poly-actions { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 5px; }
        .edit-boundary-btn, .delete-boundary-btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .edit-boundary-btn { background: #007bff; color: white; }
        .edit-boundary-btn:hover { background: #0056b3; }
        .delete-boundary-btn { background: #dc3545; color: white; }
        .delete-boundary-btn:hover { background: #c82333; }
        .current-status { margin-top: 10px; padding: 8px; background: #e9ecef; border-radius: 5px; font-size: 12px; }
        .selected-indicator { font-size: 12px; color: #dc3545; margin-top: 5px; padding: 5px; background: #ffe0e0; border-radius: 4px; }
        .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { color: white; }
        .close-btn { background: #dc3545; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .close-btn:hover { background: #c82333; }
        hr { margin: 15px 0; }
        .form-control { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .text-muted { color: #6c757d; text-align: center; padding: 20px; }
        .text-danger { color: #dc3545; text-align: center; padding: 20px; }
        .loading { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h2>✏️ Boundary Editor: {{ camera_name }}</h2>
        <button class="close-btn" onclick="window.close()">✖ Close Editor</button>
    </div>

    <div class="boundary-editor-container">
        <div class="canvas-area">
            <canvas id="boundaryCanvas" width="800" height="600"></canvas>
            <div class="current-status"><span id="statusText">Click 4 points to draw boundary</span></div>
        </div>
        <div class="controls-area">
            <div class="instruction">
                <strong>📐 How to draw/edit boundary:</strong><br>
                1. Click 4 points on the image (in order)<br>
                2. Drag any point to adjust<br>
                3. Enter boundary name<br>
                4. Click "Save New" or "Update Selected"
            </div>
            <input type="text" id="boundaryName" class="form-control" placeholder="Boundary name e.g., LeftDesk">
            <div id="selectedInfo" class="selected-indicator" style="display:none;">✏️ Editing: <span id="editingName"></span></div>
            <button id="saveNewBtn" class="btn-save">💾 Save New Boundary</button>
            <button id="updateBtn" class="btn-update" style="display:none;">✏️ Update Selected</button>
            <button id="clearPointsBtn" class="btn-clear">🗑️ Clear Points</button>
            <button id="refreshCameraBtn" class="btn-refresh">⟳ Refresh Camera Feed</button>
            <hr>
            <h6>📌 Saved Boundaries</h6>
            <div id="polygonList" class="poly-list">Loading...</div>
        </div>
    </div>

    <script>
        const cameraName = "{{ camera_name }}";
        let canvas = document.getElementById('boundaryCanvas');
        let ctx = canvas.getContext('2d');
        let img = new Image();
        let currentPoints = [];
        let draggingIndex = -1;
        let boundaries = [];
        let selectedBoundary = null;

        function getCookie(name) {
            let value = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        value = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return value;
        }

        async function loadBoundaries() {
            try {
                const response = await fetch(`/get-camera-boundaries/?camera=${encodeURIComponent(cameraName)}`);
                const data = await response.json();
                boundaries = data.boundaries || [];
                renderBoundaryList();
                drawCanvas();
            } catch(e) { 
                console.error(e); 
                boundaries = []; 
                renderBoundaryList(); 
            }
        }

        function loadFrame() {
            const url = `/get-frame-for-camera-boundary/?camera=${encodeURIComponent(cameraName)}&t=${Date.now()}`;
            img.src = url;
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                drawCanvas();
                document.getElementById('statusText').innerHTML = 'Camera loaded - Click 4 points';
            };
            img.onerror = () => {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, canvas.width || 800, canvas.height || 600);
                ctx.fillStyle = 'white';
                ctx.fillText('Cannot load camera feed.', 20, 50);
                document.getElementById('statusText').innerHTML = 'Failed to load camera feed';
            };
        }

        function drawCanvas() {
            if (img.complete && img.naturalHeight > 0) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#333';
                ctx.fillRect(0, 0, canvas.width || 800, canvas.height || 600);
            }
            boundaries.forEach((poly) => {
                if (poly.points && poly.points.length === 4) {
                    const isSelected = selectedBoundary && selectedBoundary.name === poly.name;
                    const color = isSelected ? '#dc3545' : '#00ff00';
                    drawPolygon(poly.points, color, 2);
                    drawPoints(poly.points, isSelected);
                    let cx = poly.points.reduce((s,p)=>s+p[0],0)/4;
                    let cy = poly.points.reduce((s,p)=>s+p[1],0)/4;
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(poly.name, cx-20, cy-10);
                }
            });
            if (currentPoints.length > 0) {
                drawPolygon(currentPoints, '#ff0000', 3);
                drawPoints(currentPoints, true);
            }
        }

        function drawPolygon(points, color, width) {
            if (points.length < 3) return;
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i=1; i<points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
            ctx.closePath();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.stroke();
            ctx.fillStyle = color + '20';
            ctx.fill();
        }

        function drawPoints(points, isActive) {
            points.forEach((p,i) => {
                ctx.beginPath();
                ctx.arc(p[0], p[1], isActive ? 7 : 5, 0, 2*Math.PI);
                ctx.fillStyle = isActive ? '#dc3545' : '#00ff00';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Arial';
                ctx.fillText((i+1).toString(), p[0]-4, p[1]-4);
            });
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return { x: Math.min(Math.max(0, (e.clientX - rect.left) * scaleX), canvas.width),
                     y: Math.min(Math.max(0, (e.clientY - rect.top) * scaleY), canvas.height) };
        }

        canvas.addEventListener('mousedown', (e) => {
            const {x,y} = getMousePos(e);
            draggingIndex = -1;
            for (let i=0; i<currentPoints.length; i++) {
                if (Math.hypot(currentPoints[i][0]-x, currentPoints[i][1]-y) < 15) { 
                    draggingIndex = i; 
                    break; 
                }
            }
            if (draggingIndex === -1 && currentPoints.length < 4) {
                currentPoints.push([Math.round(x), Math.round(y)]);
                drawCanvas();
                document.getElementById('statusText').innerHTML = `${currentPoints.length}/4 points drawn`;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (draggingIndex !== -1) {
                const {x,y} = getMousePos(e);
                currentPoints[draggingIndex] = [Math.round(x), Math.round(y)];
                drawCanvas();
            }
        });

        canvas.addEventListener('mouseup', () => { draggingIndex = -1; });

        document.getElementById('saveNewBtn').onclick = async () => {
            const name = document.getElementById('boundaryName').value.trim();
            if (!name) { alert('Enter a boundary name'); return; }
            if (currentPoints.length !== 4) { alert('Draw exactly 4 points'); return; }
            if (boundaries.some(b => b.name === name)) { alert('Boundary name already exists'); return; }
            document.getElementById('saveNewBtn').disabled = true;
            document.getElementById('saveNewBtn').innerHTML = 'Saving...';
            try {
                const response = await fetch('/save-camera-boundary/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ camera_name: cameraName, points: currentPoints, boundary_name: name })
                });
                const result = await response.json();
                if (result.success) {
                    alert('Boundary saved!');
                    currentPoints = [];
                    document.getElementById('boundaryName').value = '';
                    await loadBoundaries();
                    drawCanvas();
                    if (window.opener && !window.opener.closed) {
                        window.opener.postMessage({ type: 'boundarySaved', cameraName: cameraName }, '*');
                    }
                } else alert('Error: ' + result.error);
            } catch(e) { alert('Network error: ' + e.message); }
            finally {
                document.getElementById('saveNewBtn').disabled = false;
                document.getElementById('saveNewBtn').innerHTML = '💾 Save New Boundary';
            }
        };

        document.getElementById('updateBtn').onclick = async () => {
            if (!selectedBoundary) { alert('Select a boundary to update'); return; }
            if (currentPoints.length !== 4) { alert('Draw exactly 4 points'); return; }
            document.getElementById('updateBtn').disabled = true;
            document.getElementById('updateBtn').innerHTML = 'Updating...';
            try {
                const response = await fetch('/save-camera-boundary/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ camera_name: cameraName, points: currentPoints, boundary_name: selectedBoundary.name })
                });
                const result = await response.json();
                if (result.success) {
                    alert('Boundary updated!');
                    currentPoints = [];
                    document.getElementById('boundaryName').value = '';
                    await loadBoundaries();
                    drawCanvas();
                    selectedBoundary = null;
                    document.getElementById('selectedInfo').style.display = 'none';
                    document.getElementById('updateBtn').style.display = 'none';
                    document.getElementById('saveNewBtn').style.display = 'block';
                } else alert('Error: ' + result.error);
            } catch(e) { alert('Network error: ' + e.message); }
            finally {
                document.getElementById('updateBtn').disabled = false;
                document.getElementById('updateBtn').innerHTML = '✏️ Update Selected';
            }
        };

        document.getElementById('clearPointsBtn').onclick = () => {
            currentPoints = [];
            draggingIndex = -1;
            drawCanvas();
            document.getElementById('statusText').innerHTML = 'Points cleared';
        };

        document.getElementById('refreshCameraBtn').onclick = () => {
            loadFrame();
            document.getElementById('statusText').innerHTML = 'Refreshing camera feed...';
        };

        async function deleteBoundary(boundaryName) {
            if (!confirm(`Delete "${boundaryName}"?`)) return;
            try {
                const response = await fetch('/delete-camera-boundary/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                    body: JSON.stringify({ camera_name: cameraName, boundary_name: boundaryName })
                });
                const result = await response.json();
                if (result.success) {
                    await loadBoundaries();
                    drawCanvas();
                    if (selectedBoundary && selectedBoundary.name === boundaryName) {
                        selectedBoundary = null;
                        document.getElementById('selectedInfo').style.display = 'none';
                        document.getElementById('updateBtn').style.display = 'none';
                        document.getElementById('saveNewBtn').style.display = 'block';
                        document.getElementById('boundaryName').value = '';
                        currentPoints = [];
                    }
                } else alert('Delete failed');
            } catch(e) { alert('Network error: ' + e.message); }
        }

        function editBoundary(boundary) {
            selectedBoundary = boundary;
            currentPoints = [...boundary.points];
            document.getElementById('boundaryName').value = boundary.name;
            document.getElementById('selectedInfo').style.display = 'block';
            document.getElementById('editingName').innerText = boundary.name;
            document.getElementById('updateBtn').style.display = 'block';
            document.getElementById('saveNewBtn').style.display = 'none';
            drawCanvas();
            document.getElementById('statusText').innerHTML = `Editing "${boundary.name}" – drag points then click Update`;
        }

        function renderBoundaryList() {
            const container = document.getElementById('polygonList');
            if (boundaries.length === 0) {
                container.innerHTML = '<div class="text-muted">No boundaries saved. Click "Save New Boundary".</div>';
                return;
            }
            container.innerHTML = '';
            boundaries.forEach(poly => {
                const div = document.createElement('div');
                div.className = 'poly-item';
                const isSelected = selectedBoundary && selectedBoundary.name === poly.name;
                if (isSelected) div.classList.add('active');
                div.innerHTML = `<div class="poly-name">${escapeHtml(poly.name)}</div>
                                <div class="poly-points">${poly.points.map(p=>`(${p[0]},${p[1]})`).join(', ')}</div>
                                <div class="poly-actions">
                                    <button class="edit-boundary-btn">✏️ Edit</button>
                                    <button class="delete-boundary-btn">🗑️ Delete</button>
                                </div>`;
                div.querySelector('.edit-boundary-btn').addEventListener('click', (e) => { e.stopPropagation(); editBoundary(poly); });
                div.querySelector('.delete-boundary-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteBoundary(poly.name); });
                container.appendChild(div);
            });
        }

        function escapeHtml(text) { 
            let d = document.createElement('div'); 
            d.textContent = text; 
            return d.innerHTML; 
        }
        
        loadFrame();
        loadBoundaries();
    </script>
</body>
</html>
