<!-- { Pre-loader } start -->
<div id="globalPageLoader" class="global-loader">
  <div class="loader-content">
    <div class="wave-loader">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <div class="loader-text-wrapper">
      <p class="loader-text">Loading</p>
      <span class="loader-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </div>
  </div>
</div>

<style>
  :root {
    --primary: #7b0323;
    --primary-light: #f9edf0;
    --primary-accent: #a0525b;
  }

  .global-loader {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(249, 237, 240, 0.7) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }

  .global-loader.active {
    display: flex;
  }

  .loader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: scaleIn 0.4s ease-out;
  }

  @keyframes scaleIn {
    from {
      opacity: 0;
      transform: scale(0.85);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .wave-loader {
    width: 140px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 8px;
  }

  .wave {
    width: 12px;
    height: 50px;
    background: linear-gradient(180deg, var(--primary) 0%, var(--primary-accent) 100%);
    border-radius: 6px;
    animation: waveAnimation 1.2s ease-in-out infinite;
    box-shadow: 0 4px 12px rgba(123, 3, 35, 0.25);
  }

  .wave:nth-child(1) {
    animation-delay: 0s;
  }

  .wave:nth-child(2) {
    animation-delay: 0.15s;
  }

  .wave:nth-child(3) {
    animation-delay: 0.3s;
  }

  .wave:nth-child(4) {
    animation-delay: 0.45s;
  }

  .wave:nth-child(5) {
    animation-delay: 0.6s;
  }

  @keyframes waveAnimation {
    0%, 100% {
      transform: scaleY(0.5);
      opacity: 0.6;
    }
    50% {
      transform: scaleY(1);
      opacity: 1;
    }
  }

  .loader-text-wrapper {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .loader-text {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    letter-spacing: 0.5px;
  }

  .loader-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary-accent);
    animation: dotPulse 1.4s ease-in-out infinite;
  }

  .dot:nth-child(1) {
    animation-delay: 0s;
  }

  .dot:nth-child(2) {
    animation-delay: 0.2s;
  }

  .dot:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes dotPulse {
    0%, 100% {
      opacity: 0.4;
      transform: scale(0.8);
    }
    50% {
      opacity: 1;
      transform: scale(1.2);
    }
  }

  /* Fallback loader for initial page load */
  .loader-bg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(249, 237, 240, 0.7) 100%);
    backdrop-filter: blur(8px);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }

  .loader-track {
    width: 60px;
    height: 4px;
    background: var(--primary-light);
    border-radius: 2px;
    overflow: hidden;
  }

  .loader-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-accent));
    animation: loadFill 2s ease-in-out infinite;
  }

  @keyframes loadFill {
    0% { width: 0%; }
    50% { width: 100%; }
    100% { width: 100%; }
  }
</style>

<script>
  // Global page loader
  const globalLoader = document.getElementById('globalPageLoader');
  
  // Show loader on link clicks
  document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (link && link.href) {
      const href = link.getAttribute('href');
      
      // Don't show loader for:
      // - Hash links
      // - External links
      // - Links with target="_blank"
      // - Download links
      if (href && 
          !href.startsWith('#') && 
          !link.getAttribute('target') &&
          (href.startsWith('/') || href.startsWith(window.location.origin))) {
        globalLoader.classList.add('active');
      }
    }
  });

  // Show loader on form submission
  document.addEventListener('submit', function(e) {
    const form = e.target;
    if (form.method.toUpperCase() === 'POST' || !form.action || form.action.startsWith(window.location.origin)) {
      globalLoader.classList.add('active');
    }
  });

  // Hide loader when page loads
  window.addEventListener('load', function() {
    globalLoader.classList.remove('active');
  });

  // Hide loader on back/forward navigation
  window.addEventListener('pageshow', function() {
    globalLoader.classList.remove('active');
  });

  // Show loader on before unload
  window.addEventListener('beforeunload', function() {
    globalLoader.classList.add('active');
  });
</script>
<!-- { Pre-loader } End -->
